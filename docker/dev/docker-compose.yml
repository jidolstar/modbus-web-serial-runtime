services:
  frontend:
    container_name: modbus-frontend
    build:
      context: ../..
      dockerfile: docker/dev/frontend/Dockerfile
    env_file:
      - ../../.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    expose:
      - "5173"
    volumes:
      - ../../frontend:/workspace/frontend
      - ../../common/device-catalog-domain:/workspace/common/device-catalog-domain:ro
      # file dependency의 설치 시점 복사본 대신 현재 공용 Catalog 계약을 개발 서버가 즉시 사용한다.
      - ../../common/device-catalog-domain:/workspace/frontend/node_modules/@modbus-studio/device-catalog-domain:ro
      # 이전 패키지명으로 설치된 의존성 volume을 재사용하면 새 import를 찾지 못한다.
      - frontend_node_modules_studio:/workspace/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shared-net
    restart: unless-stopped

  backend:
    container_name: modbus-backend
    build:
      context: ../..
      dockerfile: docker/dev/backend/Dockerfile
    env_file:
      - ../../.env
    environment:
      # Windows Docker bind mount가 놓칠 수 있는 파일 변경을 주기적으로 확인한다.
      TSC_WATCHFILE: DynamicPriorityPolling
    expose:
      - "3000"
    volumes:
      - ../../backend:/workspace/backend
      - ../../common/device-catalog-domain:/workspace/common/device-catalog-domain:ro
      # Backend AJV가 Frontend와 같은 최신 Schema 파일을 사용하도록 package 경로도 연결한다.
      - ../../common/device-catalog-domain:/workspace/backend/node_modules/@modbus-studio/device-catalog-domain:ro
      - backend_node_modules_studio:/workspace/backend/node_modules
      - catalog_uploads:/var/lib/modbus-studio/catalog-uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:'+(process.env.PORT||3000)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - shared-net
    restart: unless-stopped

networks:
  shared-net:
    external: true
    name: shared-net

volumes:
  frontend_node_modules_studio:
  backend_node_modules_studio:
  catalog_uploads:
