services:
  frontend:
    container_name: modbus-frontend
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: development
    env_file:
      - ../.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    expose:
      - "5173"
    volumes:
      - ../frontend:/workspace/frontend
      - ../common/device-catalog-domain:/workspace/common/device-catalog-domain:ro
      # file dependency의 설치 시점 복사본 대신 현재 공용 Catalog 계약을 개발 서버가 즉시 사용한다.
      - ../common/device-catalog-domain:/workspace/frontend/node_modules/@modbus-manager/device-catalog-domain:ro
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shared-net
    restart: unless-stopped

  backend:
    container_name: modbus-backend
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: development
    env_file:
      - ../.env
    environment:
      # Windows Docker bind mount는 새 파일 생성 이벤트를 놓칠 수 있어 TypeScript가 주기적으로 변경을 확인한다.
      TSC_WATCHFILE: DynamicPriorityPolling
    expose:
      - "3000"
    volumes:
      - ../backend:/workspace/backend
      - ../common/device-catalog-domain:/workspace/common/device-catalog-domain:ro
      # Backend AJV도 Frontend와 동일한 최신 Schema 파일을 읽도록 package 경로를 직접 연결한다.
      - ../common/device-catalog-domain:/workspace/backend/node_modules/@modbus-manager/device-catalog-domain:ro
      - backend_node_modules:/workspace/backend/node_modules
      - catalog_uploads:/var/lib/modbus-manager/catalog-uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:'+(process.env.PORT||3000)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - shared-net
    restart: unless-stopped

networks:
  shared-net:
    external: true
    name: shared-net

volumes:
  frontend_node_modules:
  backend_node_modules:
  catalog_uploads:
