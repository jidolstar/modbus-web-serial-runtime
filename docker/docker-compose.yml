services:
  frontend:
    container_name: modbus-frontend
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: development
    env_file:
      - ../.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    expose:
      - "5173"
    volumes:
      - ../frontend:/workspace/frontend
      - ../common/device-catalog-domain:/workspace/common/device-catalog-domain:ro
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shared-net
    restart: unless-stopped

  backend:
    container_name: modbus-backend
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: development
    env_file:
      - ../.env
    expose:
      - "3000"
    volumes:
      - ../backend:/workspace/backend
      - ../common/device-catalog-domain:/workspace/common/device-catalog-domain:ro
      - backend_node_modules:/workspace/backend/node_modules
      - catalog_uploads:/var/lib/modbus-manager/catalog-uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:'+(process.env.PORT||3000)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - shared-net
    restart: unless-stopped

networks:
  shared-net:
    external: true
    name: shared-net

volumes:
  frontend_node_modules:
  backend_node_modules:
  catalog_uploads:
